<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="honeyCap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb74d"/>
      <stop offset="50%" stop-color="#ffa726"/>
      <stop offset="100%" stop-color="#ff9800"/>
    </linearGradient>
    
    <linearGradient id="honeyStem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d7ccc8"/>
      <stop offset="100%" stop-color="#bcaaa4"/>
    </linearGradient>
    
    <linearGradient id="honeySpot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8d6e63"/>
      <stop offset="100%" stop-color="#6d4c41"/>
    </linearGradient>
  </defs>

  <!-- Группа опят -->
  <!-- Гриб 1 -->
  <path d="M25 45 L25 38 L29 38 L29 45 Z" fill="url(#honeyStem)"/>
  <circle cx="27" cy="38" r="4" fill="url(#honeyCap)"/>
  <circle cx="27" cy="38" r="3.2" fill="url(#honeySpot)" opacity="0.3"/>
  
  <!-- Гриб 2 -->
  <path d="M35 42 L35 36 L39 36 L39 42 Z" fill="url(#honeyStem)"/>
  <circle cx="37" cy="36" r="3.5" fill="url(#honeyCap)"/>
  <circle cx="37" cy="36" r="2.8" fill="url(#honeySpot)" opacity="0.3"/>
  
  <!-- Гриб 3 -->
  <path d="M45 40 L45 34 L49 34 L49 40 Z" fill="url(#honeyStem)"/>
  <circle cx="47" cy="34" r="3" fill="url(#honeyCap)"/>
  <circle cx="47" cy="34" r="2.4" fill="url(#honeySpot)" opacity="0.3"/>
  
  <!-- Гриб 4 (маленький) -->
  <path d="M30 48 L30 44 L32 44 L32 48 Z" fill="url(#honeyStem)"/>
  <circle cx="31" cy="44" r="2" fill="url(#honeyCap)"/>
  
  <!-- Блеск -->
  <circle cx="27" cy="36" r="0.8" fill="#ffffff" opacity="0.9">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="1.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="47" cy="32" r="0.6" fill="#ffffff" opacity="0.8">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="0.9s" repeatCount="indefinite" begin="0.3s"/>
  </circle>
</svg>