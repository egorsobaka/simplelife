<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mountainShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3e50" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#34495e" stop-opacity="0.4"/>
    </linearGradient>
    
    <linearGradient id="snowCap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#f8f9fa"/>
      <stop offset="70%" stop-color="#e9ecef"/>
      <stop offset="100%" stop-color="#dee2e6"/>
    </linearGradient>
    
    <linearGradient id="rockTexture" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5d6d7e"/>
      <stop offset="50%" stop-color="#4a5c6a"/>
      <stop offset="100%" stop-color="#3a4856"/>
    </linearGradient>
    
    <filter id="mountainShadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="4" dy="4" result="offsetblur"/>
      <feFlood flood-color="#2c3e50" flood-opacity="0.6"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Основная тень горы -->
  <path d="M20 100 L64 20 L108 100 Z" fill="url(#mountainShadow)" filter="url(#mountainShadowFilter)"/>
  
  <!-- Основная масса горы -->
  <path d="M25 95 L64 25 L103 95 Z" fill="url(#rockTexture)"/>
  
  <!-- Снежная шапка -->
  <path d="M54 40 L64 25 L74 40 L69 45 L59 45 Z" fill="url(#snowCap)"/>
  
  <!-- Скальные образования и трещины -->
  <g stroke="#2c3e50" stroke-width="1.5" stroke-linecap="round" opacity="0.7">
    <!-- Левая сторона скал -->
    <path d="M35 65 L45 50" opacity="0.8"/>
    <path d="M40 70 L50 55" opacity="0.6"/>
    <path d="M30 75 L40 60" opacity="0.9"/>
    <path d="M45 80 L55 65" opacity="0.5"/>
    
    <!-- Правая сторона скал -->
    <path d="M85 65 L75 50" opacity="0.8"/>
    <path d="M80 70 L70 55" opacity="0.6"/>
    <path d="M90 75 L80 60" opacity="0.9"/>
    <path d="M75 80 L65 65" opacity="0.5"/>
    
    <!-- Центральные скальные образования -->
    <path d="M55 55 L60 45" opacity="0.8"/>
    <path d="M65 55 L60 45" opacity="0.8"/>
    <path d="M58 60 L63 50" opacity="0.6"/>
    <path d="M62 60 L67 50" opacity="0.6"/>
  </g>
  
  <!-- Детализация снежной шапки -->
  <g stroke="#ffffff" stroke-width="0.5" stroke-linecap="round" opacity="0.9">
    <path d="M57 35 L59 38"/>
    <path d="M61 35 L63 38"/>
    <path d="M65 35 L67 38"/>
    <path d="M55 40 L57 43"/>
    <path d="M69 40 L71 43"/>
  </g>
  
  <!-- Тени на скалах -->
  <g stroke="#2c3e50" stroke-width="2" stroke-linecap="round" opacity="0.4">
    <path d="M35 70 L25 85"/>
    <path d="M45 75 L35 90"/>
    <path d="M85 70 L95 85"/>
    <path d="M75 75 L85 90"/>
  </g>
  
  <!-- Основание горы -->
  <path d="M15 100 L25 95 L30 100 Z" fill="#3a4856" opacity="0.8"/>
  <path d="M103 95 L113 100 L108 100 Z" fill="#3a4856" opacity="0.8"/>
  
  <!-- Мелкие камни у подножия -->
  <g fill="#4a5c6a" opacity="0.7">
    <circle cx="22" cy="98" r="2"/>
    <circle cx="28" cy="97" r="1.5"/>
    <circle cx="35" cy="99" r="2.5"/>
    <circle cx="100" cy="98" r="2"/>
    <circle cx="94" cy="97" r="1.5"/>
    <circle cx="87" cy="99" r="2.5"/>
  </g>
  
  <!-- Световые блики на скалах -->
  <g stroke="#aab7c6" stroke-width="1" stroke-linecap="round" opacity="0.3">
    <path d="M40 60 L45 55"/>
    <path d="M50 65 L55 60"/>
    <path d="M80 60 L75 55"/>
    <path d="M70 65 L65 60"/>
  </g>
</svg>