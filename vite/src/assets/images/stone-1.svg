<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="stoneGray" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9e9e9e"/>
      <stop offset="50%" stop-color="#757575"/>
      <stop offset="100%" stop-color="#616161"/>
    </linearGradient>
    
    <linearGradient id="stoneHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bdbdbd"/>
      <stop offset="100%" stop-color="#9e9e9e"/>
    </linearGradient>
    
    <linearGradient id="stoneShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#616161"/>
      <stop offset="100%" stop-color="#424242"/>
    </linearGradient>
    
    <filter id="stoneTexture" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="2" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4"/>
    </filter>
  </defs>

  <!-- Основная форма камня -->
  <g filter="url(#stoneTexture)">
    <path d="M25 45 Q20 35 30 30 Q35 25 45 30 Q50 35 45 45 Q40 50 30 45 Z" fill="url(#stoneGray)"/>
  </g>

  <!-- Световые блики -->
  <path d="M32 32 Q35 28 38 32 Q36 34 32 34 Z" fill="url(#stoneHighlight)" opacity="0.7"/>
  <path d="M40 38 Q42 35 44 38 Q43 39 40 39 Z" fill="url(#stoneHighlight)" opacity="0.6"/>
  
  <!-- Теневые области -->
  <path d="M28 42 Q25 38 30 38 Q29 40 28 42 Z" fill="url(#stoneShadow)" opacity="0.6"/>
  <path d="M42 44 Q40 40 45 40 Q44 42 42 44 Z" fill="url(#stoneShadow)" opacity="0.5"/>

  <!-- Трещины и текстура -->
  <g stroke="#424242" stroke-width="1" stroke-linecap="round" opacity="0.8">
    <path d="M30 35 L33 38"/>
    <path d="M35 32 L38 35"/>
    <path d="M40 40 L43 43"/>
    <path d="M32 42 L35 45"/>
    <path d="M38 37 L41 40"/>
  </g>

  <!-- Эффект блеска (показывает, что можно собрать) -->
  <circle cx="35" cy="32" r="1.5" fill="#ffffff" opacity="0.9">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="42" cy="40" r="1" fill="#ffffff" opacity="0.7">
    <animate attributeName="opacity" values="0.2;0.7;0.2" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
</svg>