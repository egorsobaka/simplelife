<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="porciniCap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8d6e63"/>
      <stop offset="50%" stop-color="#6d4c41"/>
      <stop offset="100%" stop-color="#5d4037"/>
    </linearGradient>
    
    <linearGradient id="porciniStem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d7ccc8"/>
      <stop offset="100%" stop-color="#bcaaa4"/>
    </linearGradient>
    
    <linearGradient id="porciniUnder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#efebe9"/>
      <stop offset="100%" stop-color="#d7ccc8"/>
    </linearGradient>
  </defs>

  <!-- Ножка -->
  <path d="M28 45 L28 32 L36 32 L36 45 Z" fill="url(#porciniStem)"/>
  
  <!-- Шляпка -->
  <path d="M22 32 Q32 22 42 32 Q38 35 26 35 Z" fill="url(#porciniCap)"/>
  
  <!-- Нижняя часть шляпки -->
  <path d="M26 32 Q32 28 38 32 Q35 33 29 33 Z" fill="url(#porciniUnder)"/>
  
  <!-- Текстура шляпки -->
  <g stroke="#5d4037" stroke-width="0.8" stroke-linecap="round" opacity="0.7">
    <path d="M25 30 L27 29"/>
    <path d="M30 28 L32 27"/>
    <path d="M35 29 L37 28"/>
    <path d="M28 31 L30 30"/>
    <path d="M33 30 L35 29"/>
  </g>
  
  <!-- Текстура ножки -->
  <g stroke="#a1887f" stroke-width="0.5" stroke-linecap="round" opacity="0.5">
    <path d="M30 33 L30 44"/>
    <path d="M32 33 L32 44"/>
    <path d="M34 33 L34 44"/>
  </g>
  
  <!-- Блеск (ценный гриб) -->
  <circle cx="32" cy="28" r="1.5" fill="#ffd54f" opacity="0.9">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>