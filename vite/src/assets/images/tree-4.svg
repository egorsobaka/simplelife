<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pineTrunk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b4513"/>
      <stop offset="100%" stop-color="#654321"/>
    </linearGradient>
    
    <linearGradient id="pineGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#33691e"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
    
    <linearGradient id="pineHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#558b2f"/>
      <stop offset="100%" stop-color="#33691e"/>
    </linearGradient>
  </defs>

  <!-- Ствол сосны -->
  <path d="M62 100 L62 50 L66 50 L66 100 Z" fill="url(#pineTrunk)"/>
  
  <!-- Текстура коры сосны -->
  <g stroke="#5d4037" stroke-width="1.5" stroke-linecap="round" opacity="0.7">
    <path d="M63 55 L63 95"/>
    <path d="M64 53 L64 93"/>
    <path d="M65 55 L65 95"/>
    <!-- Сучья -->
    <path d="M62 70 L50 65" opacity="0.8"/>
    <path d="M62 80 L45 75" opacity="0.6"/>
    <path d="M66 75 L78 70" opacity="0.8"/>
    <path d="M66 85 L83 80" opacity="0.6"/>
  </g>

  <!-- Ветви сосны -->
  <!-- Левая сторона -->
  <path d="M40 60 Q62 40 50 75 Z" fill="url(#pineGreen)"/>
  <path d="M35 70 Q62 50 45 85 Z" fill="url(#pineGreen)"/>
  <path d="M30 80 Q62 60 40 95 Z" fill="url(#pineGreen)"/>
  
  <!-- Правая сторона -->
  <path d="M88 60 Q66 40 78 75 Z" fill="url(#pineGreen)"/>
  <path d="M93 70 Q66 50 83 85 Z" fill="url(#pineGreen)"/>
  <path d="M98 80 Q66 60 88 95 Z" fill="url(#pineGreen)"/>
  
  <!-- Верхние ветви -->
  <path d="M50 40 Q64 20 78 40 Z" fill="url(#pineHighlight)"/>
  <path d="M55 30 Q64 15 73 30 Z" fill="url(#pineHighlight)"/>
  
  <!-- Верхушка -->
  <path d="M60 25 L64 10 L68 25 Z" fill="url(#pineHighlight)"/>

  <!-- Иголки сосны -->
  <g stroke="#1b5e20" stroke-width="0.6" stroke-linecap="round" opacity="0.5">
    <!-- Левая сторона -->
    <path d="M45 65 L43 63"/>
    <path d="M40 70 L38 68"/>
    <path d="M35 75 L33 73"/>
    <path d="M30 80 L28 78"/>
    
    <!-- Правая сторона -->
    <path d="M83 65 L85 63"/>
    <path d="M88 70 L90 68"/>
    <path d="M93 75 L95 73"/>
    <path d="M98 80 L100 78"/>
    
    <!-- Верхние -->
    <path d="M60 35 L58 33"/>
    <path d="M68 35 L70 33"/>
  </g>

  <!-- Основание -->
  <ellipse cx="64" cy="100" rx="10" ry="4" fill="#5d4037"/>
</svg>