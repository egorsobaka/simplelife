<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mountainGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a6b32"/>
      <stop offset="100%" stop-color="#1e3f1a"/>
    </linearGradient>
    <linearGradient id="treeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2d5a27"/>
    </linearGradient>
  </defs>
  
  <!-- Основа горы с градиентом -->
  <path d="M8 46 L32 8 L56 46 Z" fill="url(#mountainGradient)" stroke="#1e3f1a" stroke-width="0.5"/>
  
  <!-- Деревья как круги с градиентом -->
  <g fill="url(#treeGradient)">
    <!-- Верхний ярус -->
    <circle cx="25" cy="20" r="3"/>
    <circle cx="32" cy="15" r="2.5"/>
    <circle cx="39" cy="22" r="3"/>
    
    <!-- Средний ярус -->
    <circle cx="20" cy="30" r="4"/>
    <circle cx="28" cy="28" r="3.5"/>
    <circle cx="36" cy="30" r="4"/>
    <circle cx="44" cy="28" r="3.5"/>
    
    <!-- Нижний ярус -->
    <circle cx="16" cy="38" r="4.5"/>
    <circle cx="24" cy="36" r="4"/>
    <circle cx="32" cy="38" r="4.5"/>
    <circle cx="40" cy="36" r="4"/>
    <circle cx="48" cy="38" r="4.5"/>
  </g>
  
  <!-- Стволы деревьев -->
  <g fill="#5d4037">
    <rect x="15.5" y="42.5" width="1" height="4"/>
    <rect x="23.5" y="40.5" width="1" height="4"/>
    <rect x="31.5" y="42.5" width="1" height="4"/>
    <rect x="39.5" y="40.5" width="1" height="4"/>
    <rect x="47.5" y="42.5" width="1" height="4"/>
  </g>
  
  <!-- Трава у подножия -->
  <g fill="#4caf50">
    <path d="M10 46 L11 44 L12 46 Z"/>
    <path d="M15 46 L16 44 L17 46 Z"/>
    <path d="M20 46 L21 44 L22 46 Z"/>
    <path d="M30 46 L31 44 L32 46 Z"/>
    <path d="M40 46 L41 44 L42 46 Z"/>
    <path d="M50 46 L51 44 L52 46 Z"/>
    <path d="M55 46 L56 44 L57 46 Z"/>
  </g>
</svg>