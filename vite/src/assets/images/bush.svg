<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bushDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
    
    <linearGradient id="bushMedium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#388e3c"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    
    <linearGradient id="bushLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#388e3c"/>
    </linearGradient>
    
    <linearGradient id="bushStem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b4513"/>
      <stop offset="100%" stop-color="#654321"/>
    </linearGradient>
    
    <filter id="leafTexture" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3"/>
    </filter>
  </defs>

  <!-- Тень куста -->
  <ellipse cx="64" cy="115" rx="35" ry="10" fill="#2d2d2d" opacity="0.2"/>
  
  <!-- Основные ветви куста -->
  <g filter="url(#leafTexture)">
    <!-- Левая часть куста -->
    <ellipse cx="45" cy="75" rx="25" ry="30" fill="url(#bushDark)" transform="rotate(-15 45 75)"/>
    <ellipse cx="35" cy="85" rx="20" ry="25" fill="url(#bushMedium)" transform="rotate(-10 35 85)"/>
    
    <!-- Центральная часть -->
    <ellipse cx="64" cy="70" rx="30" ry="35" fill="url(#bushMedium)"/>
    <ellipse cx="64" cy="85" rx="25" ry="30" fill="url(#bushDark)"/>
    
    <!-- Правая часть куста -->
    <ellipse cx="83" cy="75" rx="25" ry="30" fill="url(#bushDark)" transform="rotate(15 83 75)"/>
    <ellipse cx="93" cy="85" rx="20" ry="25" fill="url(#bushMedium)" transform="rotate(10 93 85)"/>
    
    <!-- Верхние пучки -->
    <ellipse cx="55" cy="55" rx="15" ry="20" fill="url(#bushLight)" transform="rotate(-5 55 55)"/>
    <ellipse cx="73" cy="55" rx="15" ry="20" fill="url(#bushLight)" transform="rotate(5 73 55)"/>
    <ellipse cx="64" cy="50" rx="18" ry="15" fill="url(#bushLight)"/>
  </g>

  <!-- Стебли и ветки -->
  <g stroke="url(#bushStem)" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <path d="M60 95 L55 75"/>
    <path d="M64 95 L64 80"/>
    <path d="M68 95 L73 75"/>
    <path d="M55 75 L50 65"/>
    <path d="M64 80 L62 70"/>
    <path d="M73 75 L78 65"/>
  </g>

  <!-- Отдельные листья -->
  <g fill="#4caf50" opacity="0.9">
    <ellipse cx="40" cy="70" rx="4" ry="3" transform="rotate(-20 40 70)"/>
    <ellipse cx="50" cy="60" rx="3" ry="4" transform="rotate(15 50 60)"/>
    <ellipse cx="30" cy="80" rx="5" ry="3" transform="rotate(-30 30 80)"/>
    <ellipse cx="75" cy="60" rx="4" ry="3" transform="rotate(25 75 60)"/>
    <ellipse cx="85" cy="70" rx="3" ry="4" transform="rotate(-15 85 70)"/>
    <ellipse cx="95" cy="80" rx="4" ry="3" transform="rotate(10 95 80)"/>
    <ellipse cx="55" cy="45" rx="5" ry="4" transform="rotate(-40 55 45)"/>
    <ellipse cx="70" cy="45" rx="4" ry="3" transform="rotate(20 70 45)"/>
  </g>

  <!-- Ягоды или цветы -->
  <g fill="#ff5252" opacity="0.8">
    <circle cx="45" cy="65" r="2"/>
    <circle cx="60" cy="60" r="1.5"/>
    <circle cx="70" cy="70" r="2"/>
    <circle cx="55" cy="75" r="1.8"/>
    <circle cx="80" cy="65" r="2.2"/>
  </g>

  <!-- Световые акценты -->
  <g fill="url(#bushLight)" opacity="0.4">
    <ellipse cx="58" cy="65" rx="3" ry="2" transform="rotate(45 58 65)"/>
    <ellipse cx="70" cy="65" rx="2" ry="3" transform="rotate(-45 70 65)"/>
    <ellipse cx="64" cy="60" rx="3" ry="2"/>
  </g>

  <!-- Основание куста -->
  <path d="M55 95 L55 100 L73 100 L73 95 Z" fill="#5d4037" opacity="0.9"/>
  <ellipse cx="64" cy="100" rx="12" ry="4" fill="#4e342e" opacity="0.8"/>
</svg>