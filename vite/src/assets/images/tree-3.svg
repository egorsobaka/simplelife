<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="spruceTrunk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b4513"/>
      <stop offset="50%" stop-color="#a0522d"/>
      <stop offset="100%" stop-color="#654321"/>
    </linearGradient>
    
    <linearGradient id="spruceDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
    
    <linearGradient id="spruceMedium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#388e3c"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    
    <linearGradient id="spruceLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#388e3c"/>
    </linearGradient>
    
    <filter id="needleTexture" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2"/>
    </filter>
  </defs>

  <!-- Тень -->
  <ellipse cx="64" cy="120" rx="20" ry="6" fill="#2d2d2d" opacity="0.3"/>
  
  <!-- Ствол -->
  <path d="M60 80 L60 40 L68 40 L68 80 Z" fill="url(#spruceTrunk)"/>
  
  <!-- Текстура коры -->
  <g stroke="#654321" stroke-width="1.2" stroke-linecap="round" opacity="0.7">
    <path d="M62 45 L62 75"/>
    <path d="M64 43 L64 73"/>
    <path d="M66 45 L66 75"/>
  </g>

  <!-- Ярусы ели (снизу вверх) -->
  <g filter="url(#needleTexture)">
    <!-- Нижний ярус -->
    <path d="M30 70 Q64 100 98 70 Q90 75 70 80 Q64 85 58 80 Q38 75 30 70 Z" fill="url(#spruceDark)"/>
    
    <!-- Средний ярус -->
    <path d="M40 55 Q64 85 88 55 Q82 60 68 65 Q64 70 60 65 Q46 60 40 55 Z" fill="url(#spruceMedium)"/>
    
    <!-- Верхний ярус -->
    <path d="M50 40 Q64 70 78 40 Q74 45 66 48 Q64 50 62 48 Q54 45 50 40 Z" fill="url(#spruceLight)"/>
    
    <!-- Верхушка -->
    <path d="M58 30 L64 20 L70 30 Q68 32 64 33 Q60 32 58 30 Z" fill="url(#spruceLight)"/>
  </g>

  <!-- Иголки детализация -->
  <g stroke="#1b5e20" stroke-width="0.8" stroke-linecap="round" opacity="0.6">
    <!-- Нижний ярус -->
    <path d="M50 72 L48 70"/>
    <path d="M60 75 L58 73"/>
    <path d="M70 75 L72 73"/>
    <path d="M80 72 L82 70"/>
    
    <!-- Средний ярус -->
    <path d="M55 58 L53 56"/>
    <path d="M65 60 L63 58"/>
    <path d="M75 60 L77 58"/>
    
    <!-- Верхний ярус -->
    <path d="M60 42 L58 40"/>
    <path d="M70 42 L72 40"/>
  </g>

  <!-- Снег на ветвях -->
  <g fill="#ffffff" opacity="0.8">
    <path d="M45 68 L55 70 L50 72 Z"/>
    <path d="M75 68 L85 70 L80 72 Z"/>
    <path d="M60 55 L70 57 L65 59 Z"/>
  </g>

  <!-- Основание -->
  <path d="M58 80 L58 85 L70 85 L70 80 Z" fill="#654321"/>
  <ellipse cx="64" cy="85" rx="8" ry="3" fill="#5d4037" opacity="0.8"/>
</svg>