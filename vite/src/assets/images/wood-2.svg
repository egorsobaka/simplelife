<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d7ccc8"/>
      <stop offset="100%" stop-color="#bcaaa4"/>
    </linearGradient>
    
    <linearGradient id="logDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bcaaa4"/>
      <stop offset="100%" stop-color="#a1887f"/>
    </linearGradient>
  </defs>

  <!-- Полено 1 -->
  <path d="M15 30 L20 25 L35 35 L30 40 Z" fill="url(#logLight)"/>
  <ellipse cx="30" cy="40" rx="3" ry="2" transform="rotate(45 30 40)" fill="#6d4c41"/>
  
  <!-- Полено 2 -->
  <path d="M25 35 L30 30 L45 40 L40 45 Z" fill="url(#logDark)"/>
  <ellipse cx="40" cy="45" rx="3" ry="2" transform="rotate(30 40 45)" fill="#5d4037"/>
  
  <!-- Текстура древесины -->
  <g stroke="#8d6e63" stroke-width="0.6" stroke-linecap="round" opacity="0.6">
    <path d="M20 27 L25 29"/>
    <path d="M25 32 L30 34"/>
    <path d="M30 37 L35 39"/>
    <path d="M35 42 L40 44"/>
  </g>
  
  <!-- Блеск -->
  <circle cx="28" cy="38" r="1" fill="#ffffff" opacity="0.8">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>