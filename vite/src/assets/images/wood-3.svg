<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="twigLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a1887f"/>
      <stop offset="100%" stop-color="#8d6e63"/>
    </linearGradient>
    
    <linearGradient id="twigDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8d6e63"/>
      <stop offset="100%" stop-color="#6d4c41"/>
    </linearGradient>
  </defs>

  <!-- Пучок веток -->
  <!-- Ветка 1 -->
  <path d="M20 35 Q25 25 30 35" stroke="url(#twigLight)" stroke-width="3" stroke-linecap="round" fill="none"/>
  
  <!-- Ветка 2 -->
  <path d="M25 30 Q30 20 35 30" stroke="url(#twigDark)" stroke-width="2" stroke-linecap="round" fill="none"/>
  
  <!-- Ветка 3 -->
  <path d="M15 40 Q20 30 25 40" stroke="url(#twigLight)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  
  <!-- Ветка 4 -->
  <path d="M30 40 Q35 35 40 40" stroke="url(#twigDark)" stroke-width="2" stroke-linecap="round" fill="none"/>
  
  <!-- Листья (если ветки с листьями) -->
  <g fill="#4caf50" opacity="0.7">
    <ellipse cx="25" cy="28" rx="2" ry="1.5" transform="rotate(-30 25 28)"/>
    <ellipse cx="30" cy="23" rx="1.5" ry="2" transform="rotate(20 30 23)"/>
    <ellipse cx="20" cy="33" rx="2" ry="1.5" transform="rotate(-15 20 33)"/>
    <ellipse cx="35" cy="38" rx="1.5" ry="2" transform="rotate(25 35 38)"/>
  </g>
  
  <!-- Блеск -->
  <circle cx="28" cy="32" r="1" fill="#ffffff" opacity="0.8">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="1.2s" repeatCount="indefinite"/>
  </circle>
</svg>