<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rockGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5d6d7e"/>
      <stop offset="30%" stop-color="#4a5c6a"/>
      <stop offset="70%" stop-color="#3a4856"/>
      <stop offset="100%" stop-color="#2c3e50"/>
    </linearGradient>
    
    <linearGradient id="rockHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#aab7c6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8395a7" stop-opacity="0.2"/>
    </linearGradient>
    
    <linearGradient id="rockShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3e50" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#34495e" stop-opacity="0.3"/>
    </linearGradient>
    
    <filter id="rockTexture" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
  </defs>

  <!-- Основная масса скалы -->
  <g filter="url(#rockTexture)">
    <!-- Левая вершина -->
    <path d="M25 90 Q35 25 45 90 Z" fill="url(#rockGradient)"/>
    
    <!-- Правая вершина -->
    <path d="M55 90 Q65 35 85 90 Z" fill="url(#rockGradient)"/>
    
    <!-- Центральная часть между вершинами -->
    <path d="M45 90 L55 90 L65 85 L55 80 Z" fill="url(#rockGradient)"/>
  </g>

  <!-- Тени на скале -->
  <path d="M30 70 L40 45 L50 70 Z" fill="url(#rockShadow)" opacity="0.7"/>
  <path d="M60 60 L70 40 L80 60 Z" fill="url(#rockShadow)" opacity="0.7"/>
  
  <!-- Световые блики -->
  <path d="M35 50 L40 35 L45 50 Z" fill="url(#rockHighlight)" opacity="0.6"/>
  <path d="M65 45 L70 30 L75 45 Z" fill="url(#rockHighlight)" opacity="0.6"/>

  <!-- Детализация - трещины и текстура -->
  <g stroke="#2c3e50" stroke-width="1.2" stroke-linecap="round" opacity="0.8">
    <!-- Трещины на левой вершине -->
    <path d="M32 60 L38 45"/>
    <path d="M35 70 L42 55"/>
    <path d="M28 75 L35 65"/>
    
    <!-- Трещины на правой вершине -->
    <path d="M68 50 L72 40"/>
    <path d="M72 60 L78 50"/>
    <path d="M65 65 L70 58"/>
    
    <!-- Горизонтальные пласты -->
    <path d="M25 75 L45 70" opacity="0.5"/>
    <path d="M30 80 L50 75" opacity="0.4"/>
    <path d="M55 70 L85 65" opacity="0.5"/>
    <path d="M60 75 L80 70" opacity="0.4"/>
  </g>

  <!-- Основание скалы -->
  <path d="M20 95 L30 90 L35 95 Z" fill="#2c3e50" opacity="0.9"/>
  <path d="M80 90 L90 95 L85 95 Z" fill="#2c3e50" opacity="0.9"/>
  
  <!-- Мелкие камни у основания -->
  <g fill="#3a4856" opacity="0.8">
    <circle cx="28" cy="92" r="2.5"/>
    <circle cx="32" cy="94" r="1.8"/>
    <circle cx="38" cy="93" r="2.2"/>
    <circle cx="82" cy="92" r="2.5"/>
    <circle cx="78" cy="94" r="1.8"/>
    <circle cx="72" cy="93" r="2.2"/>
    <circle cx="50" cy="95" r="3"/>
    <circle cx="60" cy="96" r="2.2"/>
  </g>

  <!-- Дополнительная текстура -->
  <g stroke="#34495e" stroke-width="0.8" stroke-linecap="round" opacity="0.4">
    <!-- Точечная текстура -->
    <path d="M40 60 L41 61" />
    <path d="M45 65 L46 66" />
    <path d="M50 55 L51 56" />
    <path d="M70 55 L71 56" />
    <path d="M75 60 L76 61" />
    <path d="M80 65 L81 66" />
  </g>

  <!-- Контур скалы -->
  <path d="M25 90 Q35 25 45 90 M55 90 Q65 35 85 90" 
        stroke="#2c3e50" stroke-width="2" fill="none" opacity="0.7"/>
</svg>