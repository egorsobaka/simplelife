<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="choppedLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d7ccc8"/>
      <stop offset="100%" stop-color="#bcaaa4"/>
    </linearGradient>
    
    <linearGradient id="choppedDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bcaaa4"/>
      <stop offset="100%" stop-color="#a1887f"/>
    </linearGradient>
  </defs>

  <!-- Куча рубленых дров -->
  <!-- Нижний слой -->
  <rect x="20" y="40" width="24" height="8" fill="url(#choppedDark)" rx="2" ry="2"/>
  <rect x="25" y="35" width="14" height="8" fill="url(#choppedLight)" rx="2" ry="2"/>
  
  <!-- Верхний слой -->
  <rect x="22" y="30" width="20" height="6" fill="url(#choppedDark)" rx="1" ry="1"/>
  <rect x="28" y="25" width="8" height="6" fill="url(#choppedLight)" rx="1" ry="1"/>
  
  <!-- Текстура древесины -->
  <g stroke="#8d6e63" stroke-width="0.5" stroke-linecap="round" opacity="0.6">
    <path d="M22 42 L26 42"/>
    <path d="M30 42 L34 42"/>
    <path d="M38 42 L42 42"/>
    <path d="M26 37 L30 37"/>
    <path d="M34 37 L38 37"/>
    <path d="M24 32 L28 32"/>
    <path d="M32 32 L36 32"/>
    <path d="M40 32 L44 32"/>
  </g>
  
  <!-- Срезы -->
  <g fill="#6d4c41" opacity="0.8">
    <rect x="20" y="40" width="2" height="8"/>
    <rect x="42" y="40" width="2" height="8"/>
    <rect x="25" y="35" width="2" height="8"/>
    <rect x="37" y="35" width="2" height="8"/>
  </g>
  
  <!-- Блеск -->
  <circle cx="32" cy="38" r="1.2" fill="#ffffff" opacity="0.9">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="28" cy="32" r="0.8" fill="#ffffff" opacity="0.7">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="1.2s" repeatCount="indefinite" begin="0.4s"/>
  </circle>
</svg>