<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="woodLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d7ccc8"/>
      <stop offset="50%" stop-color="#bcaaa4"/>
      <stop offset="100%" stop-color="#a1887f"/>
    </linearGradient>
    
    <linearGradient id="woodDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a1887f"/>
      <stop offset="100%" stop-color="#8d6e63"/>
    </linearGradient>
    
    <linearGradient id="woodRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6d4c41"/>
      <stop offset="100%" stop-color="#5d4037"/>
    </linearGradient>
    
    <pattern id="woodGrain" patternUnits="userSpaceOnUse" width="8" height="8">
      <path d="M0 4 L8 4" stroke="#8d6e63" stroke-width="0.5" stroke-opacity="0.3"/>
      <path d="M2 2 L10 2" stroke="#8d6e63" stroke-width="0.3" stroke-opacity="0.2"/>
      <path d="M4 6 L12 6" stroke="#8d6e63" stroke-width="0.4" stroke-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Фон связки -->
  <ellipse cx="32" cy="40" rx="25" ry="15" fill="#5d4037" opacity="0.3"/>
  
  <!-- Основные бревна -->
  <!-- Бревно 1 -->
  <path d="M15 35 L20 30 L55 45 L50 50 Z" fill="url(#woodLight)"/>
  <path d="M20 30 L55 45" stroke="url(#woodRing)" stroke-width="1" stroke-dasharray="2,2" opacity="0.6"/>
  
  <!-- Бревно 2 -->
  <path d="M20 40 L25 35 L60 50 L55 55 Z" fill="url(#woodDark)"/>
  <path d="M25 35 L60 50" stroke="url(#woodRing)" stroke-width="1" stroke-dasharray="3,1" opacity="0.7"/>
  
  <!-- Бревно 3 -->
  <path d="M10 45 L15 40 L50 55 L45 60 Z" fill="url(#woodLight)"/>
  <path d="M15 40 L50 55" stroke="url(#woodRing)" stroke-width="1" stroke-dasharray="2,3" opacity="0.5"/>
  
  <!-- Кора и текстура -->
  <g stroke="#6d4c41" stroke-width="0.8" stroke-linecap="round" opacity="0.7">
    <!-- Текстура на бревнах -->
    <path d="M25 33 L28 34"/>
    <path d="M35 37 L38 38"/>
    <path d="M45 41 L48 42"/>
    <path d="M30 43 L33 44"/>
    <path d="M40 47 L43 48"/>
    <path d="M20 48 L23 49"/>
  </g>
  
  <!-- Годовые кольца на срезах -->
  <g fill="url(#woodRing)" opacity="0.8">
    <!-- Срез 1 -->
    <ellipse cx="50" cy="50" rx="3" ry="2" transform="rotate(45 50 50)"/>
    <circle cx="50" cy="50" r="1.5" fill="#4e342e"/>
    
    <!-- Срез 2 -->
    <ellipse cx="55" cy="55" rx="3" ry="2" transform="rotate(30 55 55)"/>
    <circle cx="55" cy="55" r="1.5" fill="#4e342e"/>
    
    <!-- Срез 3 -->
    <ellipse cx="45" cy="60" rx="3" ry="2" transform="rotate(60 45 60)"/>
    <circle cx="45" cy="60" r="1.5" fill="#4e342e"/>
  </g>
  
  <!-- Веревка связки -->
  <path d="M20 32 Q32 25 44 32" stroke="#8d6e63" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M22 38 Q32 31 42 38" stroke="#8d6e63" stroke-width="2" stroke-linecap="round" fill="none"/>
  
  <!-- Блеск (индикатор собираемости) -->
  <circle cx="40" cy="45" r="1.5" fill="#ffffff" opacity="0.9">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="30" cy="40" r="1" fill="#ffffff" opacity="0.7">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="1.5s" repeatCount="indefinite" begin="0.6s"/>
  </circle>
</svg>