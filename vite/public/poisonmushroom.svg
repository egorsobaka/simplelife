<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="amanitaCap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5252"/>
      <stop offset="50%" stop-color="#d32f2f"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>
    
    <linearGradient id="amanitaStem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f5f5"/>
      <stop offset="100%" stop-color="#e0e0e0"/>
    </linearGradient>
    
    <radialGradient id="amanitaSpot" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f5f5" stop-opacity="0.9"/>
    </radialGradient>
  </defs>

  <!-- Ножка -->
  <path d="M28 45 L28 35 L36 35 L36 45 Z" fill="url(#amanitaStem)"/>
  <path d="M28 45 Q32 48 36 45" fill="#e0e0e0"/>
  
  <!-- Шляпка -->
  <path d="M20 35 Q32 25 44 35 Q40 40 24 40 Z" fill="url(#amanitaCap)"/>
  
  <!-- Пятна на шляпке -->
  <circle cx="25" cy="32" r="2.5" fill="url(#amanitaSpot)"/>
  <circle cx="35" cy="30" r="2" fill="url(#amanitaSpot)"/>
  <circle cx="40" cy="33" r="1.8" fill="url(#amanitaSpot)"/>
  <circle cx="30" cy="35" r="1.5" fill="url(#amanitaSpot)"/>
  
  <!-- Текстура ножки -->
  <g stroke="#bdbdbd" stroke-width="0.5" stroke-linecap="round" opacity="0.6">
    <path d="M30 36 L30 44"/>
    <path d="M32 36 L32 44"/>
    <path d="M34 36 L34 44"/>
  </g>
  
  <!-- Блеск (ядовитый гриб) -->
  <circle cx="32" cy="32" r="1.2" fill="#ffeb3b" opacity="0.9">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="1.2s" repeatCount="indefinite"/>
  </circle>
</svg>