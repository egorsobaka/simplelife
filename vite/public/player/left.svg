<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skinLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffdbac"/>
      <stop offset="100%" stop-color="#f0c8a4"/>
    </linearGradient>
    
    <linearGradient id="shirtLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3498db"/>
      <stop offset="100%" stop-color="#2980b9"/>
    </linearGradient>
    
    <linearGradient id="pantsLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
  </defs>

  <!-- Голова (повернута влево) -->
  <circle cx="29" cy="20" r="12" fill="url(#skinLeft)"/>
  
  <!-- Тело (наклон влево) -->
  <path d="M26 32 L26 48 L34 48 L34 32 Z" fill="url(#shirtLeft)"/>
  
  <!-- Ноги (шаг левой ногой) -->
  <path d="M26 48 L24 52 L28 54 L26 48 Z" fill="url(#pantsLeft)"/> <!-- Левая нога (шаг) -->
  <path d="M34 48 L32 56 L36 58 L34 48 Z" fill="url(#pantsLeft)"/> <!-- Правая нога -->
  
  <!-- Руки (в движении) -->
  <path d="M26 36 L21 38 L23 40 L26 36 Z" fill="url(#skinLeft)"/> <!-- Левая рука (вперед) -->
  <path d="M34 36 L39 34 L37 32 L34 36 Z" fill="url(#skinLeft)"/> <!-- Правая рука (назад) -->
  
  <!-- Лицо (смотрит влево) -->
  <circle cx="27" cy="18" r="1.5" fill="#2c3e50"/> <!-- Левый глаз -->
  <circle cx="31" cy="18" r="1.5" fill="#2c3e50"/> <!-- Правый глаз -->
  <path d="M26 24 Q28 26 30 24" stroke="#2c3e50" stroke-width="1" fill="none"/> <!-- Рот -->
</svg>