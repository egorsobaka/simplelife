<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skinDown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffdbac"/>
      <stop offset="100%" stop-color="#f0c8a4"/>
    </linearGradient>
    
    <linearGradient id="shirtDown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3498db"/>
      <stop offset="100%" stop-color="#2980b9"/>
    </linearGradient>
    
    <linearGradient id="pantsDown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
  </defs>

  <!-- Голова (смотрит вниз) -->
  <circle cx="32" cy="22" r="12" fill="url(#skinDown)"/>
  
  <!-- Тело (приседание) -->
  <path d="M28 34 L28 48 L36 48 L36 34 Z" fill="url(#shirtDown)"/>
  
  <!-- Ноги (согнуты) -->
  <path d="M28 48 L26 54 L30 56 L28 48 Z" fill="url(#pantsDown)"/> <!-- Левая нога -->
  <path d="M36 48 L34 54 L38 56 L36 48 Z" fill="url(#pantsDown)"/> <!-- Правая нога -->
  
  <!-- Руки (опущены) -->
  <path d="M28 36 L26 40 L28 42 L30 38 Z" fill="url(#skinDown)"/> <!-- Левая рука -->
  <path d="M36 36 L38 40 L36 42 L34 38 Z" fill="url(#skinDown)"/> <!-- Правая рука -->
  
  <!-- Лицо (смотрит вниз) -->
  <circle cx="30" cy="20" r="1.5" fill="#2c3e50"/> <!-- Левый глаз -->
  <circle cx="34" cy="20" r="1.5" fill="#2c3e50"/> <!-- Правый глаз -->
  <path d="M30 24 Q32 22 34 24" stroke="#2c3e50" stroke-width="1" fill="none"/> <!-- Рот -->
</svg>