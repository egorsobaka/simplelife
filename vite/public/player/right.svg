<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skinRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffdbac"/>
      <stop offset="100%" stop-color="#f0c8a4"/>
    </linearGradient>
    
    <linearGradient id="shirtRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3498db"/>
      <stop offset="100%" stop-color="#2980b9"/>
    </linearGradient>
    
    <linearGradient id="pantsRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
  </defs>

  <!-- Голова (повернута вправо) -->
  <circle cx="35" cy="20" r="12" fill="url(#skinRight)"/>
  
  <!-- Тело (наклон вправо) -->
  <path d="M30 32 L30 48 L38 48 L38 32 Z" fill="url(#shirtRight)"/>
  
  <!-- Ноги (шаг правой ногой) -->
  <path d="M30 48 L28 56 L32 58 L30 48 Z" fill="url(#pantsRight)"/> <!-- Левая нога -->
  <path d="M38 48 L36 52 L40 54 L38 48 Z" fill="url(#pantsRight)"/> <!-- Правая нога (шаг) -->
  
  <!-- Руки (в движении) -->
  <path d="M30 36 L25 34 L27 32 L30 36 Z" fill="url(#skinRight)"/> <!-- Левая рука (назад) -->
  <path d="M38 36 L43 38 L41 40 L38 36 Z" fill="url(#skinRight)"/> <!-- Правая рука (вперед) -->
  
  <!-- Лицо (смотрит вправо) -->
  <circle cx="37" cy="18" r="1.5" fill="#2c3e50"/> <!-- Правый глаз -->
  <circle cx="33" cy="18" r="1.5" fill="#2c3e50"/> <!-- Левый глаз -->
  <path d="M34 24 Q36 26 38 24" stroke="#2c3e50" stroke-width="1" fill="none"/> <!-- Рот -->
</svg>