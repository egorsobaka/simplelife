<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skinUp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffdbac"/>
      <stop offset="100%" stop-color="#f0c8a4"/>
    </linearGradient>
    
    <linearGradient id="shirtUp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3498db"/>
      <stop offset="100%" stop-color="#2980b9"/>
    </linearGradient>
    
    <linearGradient id="pantsUp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
  </defs>

  <!-- Голова (смотрит вверх) -->
  <circle cx="32" cy="18" r="12" fill="url(#skinUp)"/>
  
  <!-- Тело (вытянуто) -->
  <path d="M28 30 L28 46 L36 46 L36 30 Z" fill="url(#shirtUp)"/>
  
  <!-- Ноги (вместе) -->
  <path d="M28 46 L28 56 L36 56 L36 46 Z" fill="url(#pantsUp)"/>
  
  <!-- Руки (подняты) -->
  <path d="M28 32 L24 28 L26 26 L28 30 Z" fill="url(#skinUp)"/> <!-- Левая рука -->
  <path d="M36 32 L40 28 L38 26 L36 30 Z" fill="url(#skinUp)"/> <!-- Правая рука -->
  
  <!-- Лицо (смотрит вверх) -->
  <circle cx="30" cy="16" r="1.5" fill="#2c3e50"/> <!-- Левый глаз -->
  <circle cx="34" cy="16" r="1.5" fill="#2c3e50"/> <!-- Правый глаз -->
  <circle cx="32" cy="20" r="0.8" fill="#2c3e50"/> <!-- Рот (округлый) -->
</svg>