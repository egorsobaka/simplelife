version: "3.9"

services:
  backend:
    container_name: nest-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    env_file:
      - ./backend/.env
    networks:
      - app-network

  frontend:
    container_name: phaser-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    networks:
      - app-network

  internal-nginx:
    image: nginx:latest
    container_name: internal-nginx
    restart: always
    ports:
      - "8080:80"   # прокси фронта наружу для хостового Nginx
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - app-network

  postgres:
    container_name: game-db
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: game_user
      POSTGRES_PASSWORD: game_pass
      POSTGRES_DB: game_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
