version: "3.9"

services:
  backend:
    container_name: nest-backend
    build:
      context: ./backend   # папка с Nest.js
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    depends_on:
      - postgres

  frontend:
    container_name: phaser-frontend
    build:
      context: ./frontend   # папка с React/Phaser
      dockerfile: Dockerfile
    restart: always
    ports:
      - "5173:80"   # Vite обычно на 5173, но в проде отдаём через nginx
    depends_on:
      - backend

  postgres:
    container_name: game-db
    image: postgres:15
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: game_user
      POSTGRES_PASSWORD: game_pass
      POSTGRES_DB: game_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge